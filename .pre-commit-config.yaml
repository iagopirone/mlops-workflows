default_install_hook_types: [pre-commit, pre-push, post-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]

      - id: check-yaml
        name: Check YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: Check TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]

      - id: trailing-whitespace
        name: Trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: End of file
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]

      - id: check-merge-conflict
        name: Merge conflicts
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]

      - id: pytest
        name: Executar testes
        entry: uv run --locked python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: protected-branches
        name: Proteger branches main e rc
        entry: uv run --locked python hooks/pre-push
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

      - id: commit-summary
        name: Mostrar resumo do commit
        entry: bash hooks/post-commit
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [post-commit]
