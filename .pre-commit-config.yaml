repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]

      - id: check-yaml
        name: Check YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: Check TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]

      - id: trailing-whitespace
        name: Trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: End of file
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]

      - id: check-merge-conflict
        name: Merge conflicts
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
