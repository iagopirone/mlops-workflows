[project]
name = "mlops-workflows"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
